<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050208">

<title>For You ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#030207;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

/* ================= BACKGROUND ================= */

.background{
    position:fixed;
    inset:-15%;

    background:
        radial-gradient(
            circle at 15% 20%,
            rgba(255,0,150,.24),
            transparent 30%
        ),
        radial-gradient(
            circle at 85% 75%,
            rgba(120,40,255,.25),
            transparent 32%
        ),
        radial-gradient(
            circle at 50% 50%,
            rgba(255,50,150,.10),
            transparent 45%
        ),
        linear-gradient(
            135deg,
            #020205,
            #10030d,
            #050208
        );

    animation:bgMove 16s ease-in-out infinite alternate;
}

@keyframes bgMove{
    from{
        transform:scale(1);
    }
    to{
        transform:scale(1.12) rotate(1deg);
    }
}

/* ================= GLOW ================= */

.glow{
    position:fixed;
    width:300px;
    height:300px;
    border-radius:50%;
    filter:blur(100px);
    opacity:.22;
    pointer-events:none;
}

.glow1{
    background:#ff1493;
    left:-130px;
    top:5%;
    animation:glowOne 10s infinite alternate;
}

.glow2{
    background:#743cff;
    right:-130px;
    bottom:0;
    animation:glowTwo 11s infinite alternate;
}

@keyframes glowOne{
    to{
        transform:translate(150px,130px);
    }
}

@keyframes glowTwo{
    to{
        transform:translate(-150px,-110px);
    }
}

/* ================= PARTICLES ================= */

#particles{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:2;
}

.particle{
    position:absolute;
    border-radius:50%;
    background:#fff;

    box-shadow:
        0 0 7px #fff,
        0 0 18px #ff5bc4;

    animation:floatUp linear infinite;
}

@keyframes floatUp{

    0%{
        transform:
            translateY(110vh)
            scale(.2);
        opacity:0;
    }

    15%{
        opacity:.9;
    }

    85%{
        opacity:.9;
    }

    100%{
        transform:
            translateY(-10vh)
            scale(1.4);
        opacity:0;
    }
}

/* ================= START SCREEN ================= */

.startScreen{
    position:fixed;
    inset:0;
    z-index:100;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    background:
        radial-gradient(
            circle at center,
            #270a20,
            #030207 70%
        );

    transition:
        opacity 1.2s ease,
        visibility 1.2s ease;
}

.startScreen.hide{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.startSmall{
    font-size:11px;
    letter-spacing:5px;
    color:#ffffff88;
    margin-bottom:20px;

    animation:softPulse 2.5s infinite alternate;
}

@keyframes softPulse{
    from{opacity:.4}
    to{opacity:1}
}

.startText{
    padding:0 25px;

    font-size:
        clamp(26px,6vw,46px);

    font-weight:700;
    line-height:1.3;

    background:
        linear-gradient(
            90deg,
            #fff,
            #ff9edc,
            #fff
        );

    background-size:200% auto;

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    animation:
        shine 4s linear infinite;
}

@keyframes shine{
    to{
        background-position:200% center;
    }
}

.startEmoji{
    margin-top:18px;
    font-size:28px;

    animation:
        heartBeat 1.5s infinite;
}

.tap{
    margin-top:32px;

    padding:15px 36px;

    border-radius:50px;

    border:1px solid #ffffff35;

    background:
        rgba(255,255,255,.07);

    color:#fff;

    font-size:12px;

    letter-spacing:3px;

    backdrop-filter:blur(15px);

    box-shadow:
        0 0 25px
        rgba(255,40,170,.25);

    cursor:pointer;

    transition:.4s;
}

.tap:hover{
    transform:scale(1.08);

    background:
        rgba(255,40,170,.18);

    box-shadow:
        0 0 40px
        rgba(255,40,170,.65);
}

.tap:active{
    transform:scale(.94);
}

/* ================= MAIN ================= */

.main{
    position:relative;
    z-index:5;

    width:100%;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    text-align:center;
}

.content{
    width:min(1000px,92%);
}

/* ================= TOP ================= */

.top{
    position:absolute;

    top:27px;
    left:50%;

    transform:translateX(-50%);

    font-size:9px;

    letter-spacing:5px;

    color:#ff9dde;

    white-space:nowrap;
}

/* ================= HEART ================= */

.cornerHeart{
    position:absolute;

    top:22px;
    right:25px;

    font-size:28px;

    filter:
        drop-shadow(
            0 0 15px #ff299c
        );

    animation:
        heartBeat 1.5s infinite;
}

@keyframes heartBeat{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.22);
    }
}

/* ================= DISC ================= */

.disc{
    width:70px;
    height:70px;

    margin:auto;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #ff82d0 0 5%,
            #1b0b1a 6% 25%,
            #08070b 26% 100%
        );

    border:
        1px solid #ffffff25;

    box-shadow:
        0 0 25px
        rgba(255,40,170,.45);

    animation:
        discSpin 5s linear infinite;
}

@keyframes discSpin{
    to{
        transform:rotate(360deg);
    }
}

/* ================= VISUALIZER ================= */

.visualizer{
    height:48px;

    margin:
        20px auto
        8px;

    display:flex;

    justify-content:center;
    align-items:center;

    gap:4px;
}

.bar{
    width:4px;
    height:7px;

    border-radius:20px;

    background:
        linear-gradient(
            to top,
            #ff219f,
            #ffc1eb
        );

    box-shadow:
        0 0 12px #ff299c;

    animation:
        wave .65s ease-in-out infinite alternate;
}

.bar:nth-child(1){animation-delay:.05s}
.bar:nth-child(2){animation-delay:.12s}
.bar:nth-child(3){animation-delay:.19s}
.bar:nth-child(4){animation-delay:.26s}
.bar:nth-child(5){animation-delay:.33s}
.bar:nth-child(6){animation-delay:.40s}
.bar:nth-child(7){animation-delay:.47s}
.bar:nth-child(8){animation-delay:.54s}
.bar:nth-child(9){animation-delay:.61s}
.bar:nth-child(10){animation-delay:.68s}
.bar:nth-child(11){animation-delay:.75s}

@keyframes wave{
    to{
        height:42px;
    }
}

/* ================= LYRICS ================= */

.lyricsArea{
    min-height:255px;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:15px;
}

.lyric{
    max-width:950px;

    font-size:
        clamp(
            31px,
            7vw,
            70px
        );

    font-weight:800;

    line-height:1.25;

    letter-spacing:-1px;

    color:#fff;

    text-shadow:
        0 0 12px #ff299c55;
}

.lyricEnter{
    animation:
        lyricEnter 1.8s
        cubic-bezier(.16,1,.3,1)
        both;
}

@keyframes lyricEnter{

    0%{
        opacity:0;

        transform:
            translateY(38px)
            scale(.90);

        filter:blur(13px);
    }

    45%{
        opacity:.75;

        transform:
            translateY(10px)
            scale(.97);

        filter:blur(4px);
    }

    100%{
        opacity:1;

        transform:
            translateY(0)
            scale(1);

        filter:blur(0);
    }
}

/* ================= WORD EFFECT ================= */

.word{
    display:inline-block;

    opacity:.30;

    transform:
        translateY(8px);

    transition:
        opacity .65s ease,
        transform .65s ease,
        text-shadow .65s ease;
}

.word.active{
    opacity:1;

    transform:
        translateY(0)
        scale(1.04);

    text-shadow:
        0 0 12px #ff62c5,
        0 0 30px #ff299c,
        0 0 55px #ff299c55;
}

.word.done{
    opacity:.86;
}

/* ================= EMOJI EFFECT ================= */

.emoji{
    display:inline-block;

    margin-left:8px;

    animation:
        emojiFloat 2s
        ease-in-out infinite alternate;

    filter:
        drop-shadow(
            0 0 12px
            rgba(255,70,170,.7)
        );
}

@keyframes emojiFloat{
    from{
        transform:
            translateY(3px)
            rotate(-5deg);
    }

    to{
        transform:
            translateY(-5px)
            rotate(5deg);
    }
}

/* ================= COUNTER ================= */

.counter{
    margin-top:15px;

    color:#ffffff42;

    font-size:9px;

    letter-spacing:4px;
}

/* ================= PLAYER ================= */

.player{
    position:absolute;

    bottom:17px;
    left:50%;

    transform:translateX(-50%);

    width:min(780px,90%);
}

.progressBox{
    width:100%;
    height:4px;

    background:#ffffff13;

    border-radius:20px;

    overflow:hidden;
}

.progress{
    width:0%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            #ff199c,
            #ff9ee0,
            #8a4cff
        );

    box-shadow:
        0 0 15px #ff299c;
}

.time{
    display:flex;
    justify-content:space-between;

    margin-top:7px;

    color:#ffffff50;

    font-size:9px;
}

.play{
    display:block;

    width:48px;
    height:48px;

    margin:
        13px auto
        0;

    border-radius:50%;

    border:1px solid #ffffff30;

    background:
        rgba(255,40,170,.12);

    color:#fff;

    cursor:pointer;

    font-size:16px;

    box-shadow:
        0 0 25px
        rgba(255,40,170,.25);

    transition:.3s;
}

.play:hover{
    transform:scale(1.1);

    box-shadow:
        0 0 35px
        rgba(255,40,170,.65);
}

/* ================= FULLSCREEN ================= */

.fullscreen{
    position:absolute;

    right:22px;
    bottom:23px;

    width:35px;
    height:35px;

    border-radius:50%;

    border:1px solid #ffffff25;

    background:#ffffff08;

    color:#fff;

    cursor:pointer;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

    .top{
        top:20px;
        font-size:8px;
        letter-spacing:3px;
    }

    .cornerHeart{
        top:15px;
        right:16px;
        font-size:23px;
    }

    .disc{
        width:58px;
        height:58px;
    }

    .lyricsArea{
        min-height:260px;
    }

    .lyric{
        font-size:32px;
        letter-spacing:-.5px;
    }

    .player{
        bottom:11px;
    }

    .fullscreen{
        right:13px;
        bottom:20px;
    }
}
</style>
</head>

<body>

<!-- BACKGROUND -->

<div class="background"></div>

<div class="glow glow1"></div>
<div class="glow glow2"></div>

<div id="particles"></div>


<!-- START -->

<div
    class="startScreen"
    id="startScreen"
>

    <div class="startSmall">
        WHEN SHE SAY
    </div>

    <div class="startText">
        “Mai itani bhi acchi nhi hu…”
    </div>

    <div class="startEmoji">
        🥺❤️
    </div>

    <button
        class="tap"
        id="tap"
    >
        TAP ❤️
    </button>

</div>


<!-- MAIN -->

<div class="main">

    <div class="top">
        ✦ A LITTLE MOMENT ✦
    </div>

    <div class="cornerHeart">
        ❤️
    </div>


    <div class="content">

        <div class="disc"></div>


        <!-- MUSIC VISUALIZER -->

        <div class="visualizer">

            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>

        </div>


        <!-- LYRICS -->

        <div class="lyricsArea">

            <div>

                <div
                    id="lyric"
                    class="lyric lyricEnter"
                ></div>

                <div
                    id="counter"
                    class="counter"
                ></div>

            </div>

        </div>

    </div>


    <!-- PLAYER -->

    <div class="player">

        <div class="progressBox">

            <div
                id="progress"
                class="progress"
            ></div>

        </div>


        <div class="time">

            <span id="current">
                0:00
            </span>

            <span id="total">
                0:00
            </span>

        </div>


        <button
            id="play"
            class="play"
        >
            ▶
        </button>

    </div>


    <button
        id="fullscreen"
        class="fullscreen"
    >
        ⛶
    </button>

</div>


<!-- SONG -->

<audio
    id="song"
    src="./song.mp3"
    preload="auto">
</audio>


<script>

/* ================= PARTICLES ================= */

const particleBox =
document.getElementById("particles");

for(let i=0;i<55;i++){

    const p =
        document.createElement("div");

    p.className="particle";

    const size =
        1 + Math.random()*3;

    p.style.width =
        size+"px";

    p.style.height =
        size+"px";

    p.style.left =
        Math.random()*100+"%";

    p.style.animationDuration =
        (5+Math.random()*8)+"s";

    p.style.animationDelay =
        Math.random()*8+"s";

    particleBox.appendChild(p);
}


/* ================= ELEMENTS ================= */

const song =
document.getElementById("song");

const startScreen =
document.getElementById("startScreen");

const tap =
document.getElementById("tap");

const play =
document.getElementById("play");

const lyricElement =
document.getElementById("lyric");

const counter =
document.getElementById("counter");

const progress =
document.getElementById("progress");

const currentTime =
document.getElementById("current");

const totalTime =
document.getElementById("total");

const fullscreen =
document.getElementById("fullscreen");


/* =================================================
   YOUR LYRICS
================================================= */

const LYRICS = [

    {
        time:0,
        text:"Tu bemisaal hai",
        emoji:"✨"
    },

    {
        time:3.5,
        text:"Teri kya misaal du",
        emoji:"🥺"
    },

    {
        time:7.0,
        text:"Aasma se aai hai",
        emoji:"🌙"
    },

    {
        time:10.8,
        text:"Yehi kehke taal du",
        emoji:"❤️"
    }

];


/* ================= TIME ================= */

function formatTime(seconds){

    if(!isFinite(seconds)){
        return "0:00";
    }

    const m =
        Math.floor(seconds/60);

    const s =
        Math.floor(seconds%60);

    return (
        m +
        ":" +
        String(s).padStart(2,"0")
    );
}


/* ================= SHOW LYRIC ================= */

function showLyric(index){

    if(
        index<0 ||
        index>=LYRICS.length
    ){
        return;
    }

    lyricElement.classList.remove(
        "lyricEnter"
    );

    void lyricElement.offsetWidth;

    lyricElement.innerHTML="";


    const words =
        LYRICS[index]
        .text
        .split(" ");


    words.forEach(
        (word,i)=>{

            const span =
                document.createElement(
                    "span"
                );

            span.className="word";

            span.textContent=word;

            lyricElement.appendChild(
                span
            );

            if(
                i <
                words.length-1
            ){

                lyricElement.appendChild(
                    document.createTextNode(" ")
                );

            }

        }
    );


    const emoji =
        document.createElement(
            "span"
        );

    emoji.className="emoji";

    emoji.textContent =
        LYRICS[index].emoji;

    lyricElement.appendChild(
        emoji
    );


    lyricElement.classList.add(
        "lyricEnter"
    );


    counter.textContent =
        String(index+1)
        .padStart(2,"0")
        +
        " / " +
        String(LYRICS.length)
        .padStart(2,"0");
}


/* ================= FIND LINE ================= */

function findLine(time){

    let found=-1;

    for(
        let i=0;
        i<LYRICS.length;
        i++
    ){

        if(
            time>=LYRICS[i].time
        ){

            found=i;

        }

    }

    return found;
}


/* ================= KARAOKE ================= */

function animateWords(){

    if(currentLine<0){
        return;
    }

    const current =
        LYRICS[currentLine];

    const next =
        LYRICS[currentLine+1];


    const start =
        current.time;

    const end =
        next
        ? next.time
        : song.duration;


    const elapsed =
        song.currentTime-start;

    const duration =
        end-start;


    const words =
        lyricElement
        .querySelectorAll(
            ".word"
        );


    if(
        !words.length ||
        duration<=0
    ){
        return;
    }


    const percentage =
        Math.max(
            0,
            Math.min(
                1,
                elapsed/duration
            )
        );


    const active =
        Math.floor(
            percentage*
            words.length
        );


    words.forEach(
        (word,i)=>{

            word.classList.remove(
                "active",
                "done"
            );


            if(
                i<active
            ){

                word.classList.add(
                    "done"
                );

            }


            if(
                i===active
            ){

                word.classList.add(
                    "active"
                );

            }

        }
    );
}


/* ================= STATE ================= */

let currentLine=-1;


/* ================= TAP TO START ================= */

async function startEverything(){

    /* TAP ke turant baad intro screen hatao */
    startScreen.classList.add("hide");

    song.currentTime = 0;

    try{

        await song.play();

        play.textContent = "❚❚";

    }
    catch(error){

        console.error("Audio play error:", error);

        play.textContent = "▶";

        const lyric = document.getElementById("lyric");

        if(lyric && !document.getElementById("audioError")){
            lyric.insertAdjacentHTML(
                "afterend",
                '<div id="audioError" style="margin-top:14px;font-size:11px;color:#ff9edc;opacity:.8;">Song start nahi hua — check karo song.mp3 same folder mein hai.</div>'
            );
        }
    }
}


tap.addEventListener(
    "click",
    startEverything
);


/* ================= PLAY / PAUSE ================= */

play.addEventListener(
    "click",
    ()=>{

        if(song.paused){

            song.play();

            play.textContent="❚❚";

        }
        else{

            song.pause();

            play.textContent="▶";

        }

    }
);


/* ================= METADATA ================= */

song.addEventListener(
    "loadedmetadata",
    ()=>{

        totalTime.textContent =
            formatTime(
                song.duration
            );

    }
);


/* ================= SONG TIME ================= */

song.addEventListener(
    "timeupdate",
    ()=>{

        const time =
            song.currentTime;


        currentTime.textContent =
            formatTime(time);


        if(song.duration){

            progress.style.width =
                (
                    time /
                    song.duration *
                    100
                )+"%";

        }


        const line =
            findLine(time);


        if(
            line!==-1 &&
            line!==currentLine
        ){

            currentLine=line;

            showLyric(
                currentLine
            );

        }


        animateWords();

    }
);


/* ================= FULLSCREEN ================= */

fullscreen.addEventListener(
    "click",
    ()=>{

        if(!document.fullscreenElement){

            document.documentElement
                .requestFullscreen()
                .catch(()=>{});

        }
        else{

            document.exitFullscreen();

        }

    }
);


/* ================= SONG END ================= */

song.addEventListener(
    "ended",
    ()=>{

        play.textContent="▶";

        progress.style.width="0%";

    }
);

</script>
</body>
</html>
